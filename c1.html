  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --bg:        #f5f0eb;
      --card-bg:   #ffffff;
      --border:    #e0d9d0;
      --text:      #2a2420;
      --text-muted:#7a6f65;
      --accent:    #2c4a6e;
      --red:       #c0392b;
      --green:     #2d7a3e;
      --yellow:    #8a6800;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(0,0,0,0.07);
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Nib home button ── */
    .home-icon {
      position: fixed;
      top: .8rem; left: .8rem;
      width: 72px; height: 52px;
      background: #f5f0eb;
      border: 1.5px solid #c9a84c;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      box-shadow: 0 2px 10px rgba(44,74,110,0.18);
      transition: opacity .2s, transform .2s;
      z-index: 100;
      padding: 2px;
    }
    .home-icon:hover { opacity: .85; transform: scale(1.05); }

    /* ── MINI HERO ── */
    .scene {
      position: relative;
      width: 100%;
      height: 35vh;
      min-height: 220px;
      max-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        #2b2445 0%,
        #4e3a62 30%,
        #8a5272 55%,
        #c97a6e 78%,
        #eab27f 100%
      );
    }

    .scene-svg {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 130vw);
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: fadeUp .7s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .level-badge {
      font-family: 'Lora', serif;
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 600;
      color: #fff;
      line-height: 1;
      letter-spacing: .04em;
      text-shadow: 0 4px 32px rgba(0,0,0,0.45);
    }
    .level-badge em {
      font-style: italic;
      color: #f5d97a;
    }

    .level-sub {
      font-size: clamp(.8rem, 2vw, 1rem);
      color: rgba(255,255,255,.75);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-top: .3rem;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      max-width: 900px;
      margin: 1.4rem auto .2rem;
      padding: 0 1.5rem;
      font-size: .78rem;
      color: var(--text-muted);
    }
    .breadcrumb a {
      color: var(--accent);
      text-decoration: none;
    }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { margin: 0 .4rem; }

    /* ── TWO-COLUMN LAYOUT ── */
    .columns-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .column-header {
      font-family: 'Lora', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      padding-bottom: .6rem;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .column-header .col-icon { font-size: 1rem; }

    /* ── Exercise link cards ── */
    .ex-card {
      display: flex;
      align-items: center;
      gap: .85rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem 1.1rem;
      text-decoration: none;
      color: var(--text);
      transition: box-shadow .16s, transform .16s;
      position: relative;
      overflow: hidden;
    }
    .ex-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
    }
    .ex-card.grammar::before  { background: var(--accent); }
    .ex-card.vocab::before    { background: var(--green); }
    .ex-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.10);
      transform: translateY(-2px);
    }

    .ex-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .ex-info { flex: 1; }
    .ex-title {
      font-size: .95rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .ex-desc {
      font-size: .78rem;
      color: var(--text-muted);
      margin-top: .18rem;
      line-height: 1.4;
    }
    .ex-arrow {
      font-size: .85rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform .15s;
    }
    .ex-card:hover .ex-arrow { transform: translateX(3px); }

    /* locked exercise */
    .ex-card.locked {
      background: transparent;
      border: 1.5px dashed var(--border);
      box-shadow: none;
      pointer-events: none;
    }
    .ex-card.locked::before { display: none; }
    .ex-card.locked .ex-icon,
    .ex-card.locked .ex-title,
    .ex-card.locked .ex-desc { opacity: .35; }
    .ex-card.locked .ex-arrow { opacity: .2; }

    .coming-tag {
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: .5;
    }

    /* stack columns on mobile */
    @media (max-width: 600px) {
      .columns-wrap { grid-template-columns: 1fr; gap: 1.5rem; }
    }

    /* ── ACCORDION ── */
    .accordion { margin-bottom: 0; }

    .acc-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .95rem 1.1rem;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      color: var(--text);
      text-align: left;
      box-shadow: var(--shadow);
      transition: box-shadow .16s;
      position: relative;
      overflow: hidden;
    }
    .acc-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
    }
    .acc-btn:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }

    .acc-icon  { font-size: 1.1rem; }
    .acc-label { flex: 1; }
    .acc-arrow {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: transform .25s;
      display: inline-block;
    }
    .accordion.open .acc-arrow { transform: rotate(90deg); }

    .acc-body {
      display: none;
      flex-direction: column;
      gap: .4rem;
      padding: .5rem 0 0 .5rem;
    }
    .accordion.open .acc-body { display: flex; }

    .acc-link {
      display: flex;
      align-items: center;
      gap: .65rem;
      padding: .65rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: .88rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--card-bg);
      border: 1px solid var(--border);
      transition: background .14s, box-shadow .14s;
    }
    .acc-link:hover { background: #eef3f8; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .acc-link.locked {
      color: var(--text-muted);
      background: transparent;
      border-style: dashed;
      pointer-events: none;
      opacity: .45;
    }
    .acc-soon {
      margin-left: auto;
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      font-size: .82rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 2rem;
      letter-spacing: .04em;
    }
    .watermark {
      font-size: 11px;
      color: rgba(0,0,0,.18);
      letter-spacing: .08em;
      pointer-events: none;
      text-align: right;
      padding: 0;
      position: fixed;
      bottom: 12px;
      right: 16px;
    }
  </style>
</head>
